server {
    listen ${HTTP_PORT};
    server_name _;
    root /srv/dist;
    sendfile on;
    tcp_nopush on;
    client_max_body_size 1m;
    autoindex off;

    location = /answer { proxy_pass http://127.0.0.1:8000; }
    location = /status { proxy_pass http://127.0.0.1:8000; }
    location /first-boot/ { proxy_pass http://127.0.0.1:8000; }
    location /done/ { proxy_pass http://127.0.0.1:8000; }
    location /reset/ { proxy_pass http://127.0.0.1:8000; }

    location / { try_files $uri =404; }
}
