[project]
name = "answer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask", "jinja2", "pyyaml", "ansible-core"]

[tool.setuptools]
packages = ["answer"]

[tool.setuptools.package-data]
answer = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
