---
# Users, ACLs and API tokens live in /etc/pve/user.cfg, which is cluster-wide. Run this once
# (run_once) on a cluster member after the cluster exists, or they are lost when a node joins.
- name: List existing users
  ansible.builtin.command: pveum user list --output-format json
  register: pve_user_list
  changed_when: false
  check_mode: false

- name: List existing ACLs
  ansible.builtin.command: pveum acl list --output-format json
  register: pve_acl_list
  changed_when: false
  check_mode: false

- name: Create missing users
  ansible.builtin.command: "pveum user add {{ item.userid }}"
  changed_when: true
  when: item.userid not in (pve_user_list.stdout | from_json | map(attribute='userid') | list)
  loop: "{{ pve_users }}"
  loop_control:
    label: "{{ item.userid }}"

- name: Grant missing ACLs
  ansible.builtin.command: "pveum acl modify {{ item.path }} --users {{ item.userid }} --roles {{ item.role }}"
  changed_when: true
  when: >-
    pve_acl_list.stdout | from_json
    | selectattr('type', 'eq', 'user') | selectattr('ugid', 'eq', item.userid)
    | selectattr('path', 'eq', item.path) | selectattr('roleid', 'eq', item.role) | list | length == 0
  loop: "{{ pve_users }}"
  loop_control:
    label: "{{ item.userid }}"

# The artifacts directory must exist before any token is created, or a secret could be lost.
- name: Ensure the artifacts directory exists
  ansible.builtin.file:
    path: "{{ pve_artifacts_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  check_mode: false

- name: Create missing tokens and save their secrets
  ansible.builtin.include_tasks: token.yml
  loop: "{{ pve_tokens }}"
  loop_control:
    loop_var: pve_token
    label: "{{ pve_token.userid }}!{{ pve_token.tokenid }}"
