---
# Prepare the cluster and the boot server to reinstall one node.
# Usage (from the repo root):
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook ansible/rebuild.yml -i inventory/hosts.yml -e host=<name> -e confirm=<name>
# confirm must equal host: the playbook removes the node from the cluster, so it refuses to run without it.
# The operator then PXE-boots the box and runs site.yml --limit <name>. For the e2e VMs, destroying and
# recreating the VM is ansible/e2e_reinstall.yml's job, not this playbook's.
# Refuses (nothing changed) while the node is online in the cluster or still holds guest configs.
# Any failure on the cluster side stops the run before the install state is reset (POST /reset).
- name: Check the rebuild request
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: A host name is required and must be in the inventory
      ansible.builtin.assert:
        that:
          - host is defined
          - host in groups['pve']
          - site is defined
          - confirm is defined
          - confirm == host
        fail_msg: >-
          usage: ansible-playbook ansible/rebuild.yml -i inventory/<site>.yml -e host=<name> -e confirm=<name>
          (host must be in group pve and confirm must equal host; got host='{{ host | default('') }}'
          confirm='{{ confirm | default('') }}'). Nothing was changed.
        quiet: true

    - name: Read the boot server address of this site
      when: rebuild_boot_url is not defined
      ansible.builtin.set_fact:
        rebuild_boot_url: >-
          http://{{ lookup('ansible.builtin.ini', 'BOOTSERVER_HOST type=properties file=' ~ rebuild_env_file) }}:{{
          lookup('ansible.builtin.ini', 'BOOTSERVER_HTTP_PORT type=properties file=' ~ rebuild_env_file) }}
      vars:
        rebuild_env_file: "{{ playbook_dir }}/../config/{{ site }}.env"

# The target is skipped everywhere below: it is the node being replaced and must already be down.
# any_errors_fatal: a failure (or an unreachable node) anywhere ends the whole run, so the operator play
# and its POST /reset are never reached after a failed or partial cluster removal.
- name: Cluster side
  hosts: pve
  gather_facts: false
  any_errors_fatal: true
  tags: [cluster]
  vars:
    rebuild_ip: "{{ hostvars[host].mgmt_ip | split('/') | first }}"
    rebuild_pve_dir: /etc/pve   # pmxcfs mount; overridden only by the localhost test (test_rebuild_gate.py)
    rebuild_node_dir: "{{ rebuild_pve_dir }}/nodes/{{ host }}"
  tasks:
    - name: Ask each surviving node for its cluster state
      ansible.builtin.command: pvecm status
      register: rebuild_status
      changed_when: false
      failed_when: false
      when: inventory_hostname != host

    - name: Pick a quorate surviving node
      ansible.builtin.set_fact:
        rebuild_survivor: >-
          {{ ansible_play_hosts | difference([host])
             | map('extract', hostvars) | selectattr('rebuild_status.rc', 'defined') | selectattr('rebuild_status.rc', 'eq', 0)
             | selectattr('rebuild_status.stdout', 'search', '(?m)^Quorate:\s+Yes')
             | map(attribute='inventory_hostname') | list | first | default('') }}

    - name: Another node must be quorate
      ansible.builtin.assert:
        that: rebuild_survivor != ''
        fail_msg: >-
          No other pve node is quorate, so {{ host }} cannot be removed from the cluster safely.
          Nothing was changed. Bring a quorate node up first.
        quiet: true

    # /etc/pve/nodes/<host> holds the node's guest definitions; removing it below deletes them
    # cluster-wide. Same rule as join.yml's refusal to join a node that has guests.
    - name: List guest configs the node still holds
      ansible.builtin.find:
        paths: ["{{ rebuild_node_dir }}/qemu-server", "{{ rebuild_node_dir }}/lxc"]
        patterns: "*.conf"
      register: rebuild_guests
      when: inventory_hostname == rebuild_survivor

    - name: Refuse to remove a node that has guests
      ansible.builtin.assert:
        that: rebuild_guests.matched == 0
        fail_msg: >-
          {{ host }} still holds guests ({{ rebuild_guests.files | map(attribute='path') | map('basename') | join(', ') }}
          under {{ rebuild_node_dir }}). Removing the node deletes these definitions cluster-wide and orphans
          their disks. Migrate them to another node first (qm migrate / pct migrate while {{ host }} runs; for a
          dead node, move the .conf files into another node's directory under {{ rebuild_pve_dir }}/nodes/),
          or remove them. Nothing was changed.
        quiet: true
      when: inventory_hostname == rebuild_survivor

    # pmxcfs's .members lists every cluster node with online 1/0 as seen by corosync.
    - name: Read the cluster membership
      ansible.builtin.slurp:
        src: "{{ rebuild_pve_dir }}/.members"
      register: rebuild_members
      when: inventory_hostname == rebuild_survivor

    - name: Refuse to remove a node that is still online in the cluster
      ansible.builtin.assert:
        that: rebuild_online | int == 0
        fail_msg: >-
          {{ host }} is online in the cluster. pvecm delnode must only run against a powered-off node:
          shut {{ host }} down (and keep it off until it is PXE-booted for the reinstall), then run this again.
          Nothing was changed.
        quiet: true
      vars:
        rebuild_online: >-
          {{ ((((rebuild_members.content | b64decode | from_json).nodelist | default({}))[host]
              | default({})).online | default(0)) }}
      when: inventory_hostname == rebuild_survivor

    - name: Remove the node from the cluster (an absent node is fine)
      ansible.builtin.command: "pvecm delnode {{ host | quote }}"
      register: rebuild_delnode
      changed_when: rebuild_delnode.rc == 0
      failed_when: rebuild_delnode.rc != 0 and rebuild_delnode.stderr is not search('not a known host|not found|does not exist|unknown node', ignorecase=true)
      when: inventory_hostname == rebuild_survivor

    - name: Remove the node's leftover config from the shared /etc/pve (no guests, checked above)
      ansible.builtin.file:
        path: "{{ rebuild_node_dir }}"
        state: absent
      when: inventory_hostname == rebuild_survivor

    # A reinstalled host has new SSH host keys. pmxcfs holds the cluster-wide /etc/pve/priv/known_hosts.
    - name: Forget the node's old SSH host keys on the surviving nodes
      ansible.builtin.shell: |
        set -o pipefail
        removed=0
        for f in /root/.ssh/known_hosts {{ (rebuild_pve_dir ~ '/priv/known_hosts') | quote }}; do
          [ -f "$f" ] || continue
          for n in {{ host | quote }} {{ rebuild_ip | quote }}; do
            if ssh-keygen -F "$n" -f "$f" >/dev/null 2>&1; then
              ssh-keygen -f "$f" -R "$n" >/dev/null || { echo "ssh-keygen -R $n failed on $f" >&2; exit 1; }
              removed=$((removed + 1))
            fi
            if ssh-keygen -F "$n" -f "$f" >/dev/null 2>&1; then
              echo "a key for $n remains in $f after ssh-keygen -R" >&2
              exit 1
            fi
          done
          rm -f "$f.old"
        done
        echo "$removed"
      args:
        executable: /bin/bash
      register: rebuild_keys
      changed_when: rebuild_keys.stdout | trim | int > 0
      when: inventory_hostname != host

    - name: Record that the cluster side finished on this node
      ansible.builtin.set_fact:
        rebuild_cluster_done: true
      when: inventory_hostname != host

- name: Operator side
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [boot]
  vars:
    rebuild_file: "{{ hostvars[host].operator_known_hosts | default('~/.ssh/known_hosts') }}"
    rebuild_ip: "{{ hostvars[host].mgmt_ip | split('/') | first }}"
  tasks:
    # Second line of defence behind any_errors_fatal: reset only after every surviving node finished the
    # cluster side in this run and the survivor's delnode succeeded.
    - name: The cluster side must have finished on every surviving node
      ansible.builtin.assert:
        that:
          - groups['pve'] | difference([host]) | map('extract', hostvars, 'rebuild_cluster_done') | select('defined') | list | length
            == groups['pve'] | difference([host]) | length
          - hostvars[hostvars[groups['pve'] | difference([host]) | first].rebuild_survivor].rebuild_delnode is succeeded
        fail_msg: >-
          The cluster side did not finish on every surviving node (failed, unreachable, or skipped by --tags),
          so the install state of {{ host }} is NOT reset. Fix the cause and run rebuild.yml again without tag filters.
        quiet: true

    - name: Check for the operator's known_hosts
      ansible.builtin.stat:
        path: "{{ rebuild_file }}"
      register: rebuild_kh

    - name: Forget the node's old SSH host keys locally
      ansible.builtin.command: "ssh-keygen -f {{ rebuild_file | quote }} -R {{ item | quote }}"
      register: rebuild_local_keys
      changed_when: rebuild_local_keys.stdout is search('found')
      loop: ["{{ host }}", "{{ rebuild_ip }}"]
      when: rebuild_kh.stat.exists

    - name: Remove the ssh-keygen backup
      ansible.builtin.file:
        path: "{{ rebuild_file }}.old"
        state: absent
      when: rebuild_kh.stat.exists

    - name: Let the answer service install the node again
      ansible.builtin.uri:
        url: "{{ rebuild_boot_url }}/reset/{{ host }}"
        method: POST
        status_code: 200
      changed_when: true

    - name: Next steps
      ansible.builtin.debug:
        msg: >-
          Set `install: true` for `{{ host }}`, redeploy the boot server if you changed the inventory,
          PXE-boot the host once (one-time network boot), then run `site.yml --limit {{ host }}` and set
          `install: false` again.
