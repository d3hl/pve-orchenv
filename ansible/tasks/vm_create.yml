---
# Inputs: vm_name (inventory hostname). Creates the VM stopped, 6144 MB (install-time RAM).
# Raw API instead of community.proxmox.proxmox_kvm: we need per-disk serial=, efidisk options
# and an ISO on ide2 in one create call.
- name: Create VM {{ vm_name }}
  ansible.builtin.include_tasks: pve_api.yml
  vars:
    vmid: "{{ hostvars[vm_name].vmid | int }}"
    pve_method: POST
    pve_path: "/nodes/{{ e2e_node }}/qemu"
    pve_body:
      vmid: "{{ vmid }}"
      name: "{{ vm_name }}"
      ostype: l26
      bios: ovmf
      machine: q35
      efidisk0: "{{ e2e_storage }}:1,efitype=4m,pre-enrolled-keys=0"
      cpu: host
      cores: 2
      memory: "{{ e2e_install_memory }}"
      scsihw: virtio-scsi-single
      scsi0: "{{ e2e_storage }}:32,serial={{ hostvars[vm_name].root_disks.serials[0] }}"
      scsi1: "{{ e2e_storage }}:32,serial={{ hostvars[vm_name].root_disks.serials[1] }}"
      scsi2: "{{ e2e_storage }}:16,serial={{ hostvars[vm_name].e2e_data_serial }}"
      scsi3: "{{ e2e_storage }}:16,serial={{ hostvars[vm_name].e2e_thin_serial }}"
      ide2: "{{ e2e_iso_volid }},media=cdrom"
      boot: "order=scsi0;ide2"
      net0: "virtio={{ hostvars[vm_name].mac }},bridge={{ e2e_bridge }}"
- name: Wait for creation of VM {{ vm_name }}
  ansible.builtin.include_tasks: pve_wait_task.yml
  vars:
    pve_upid: "{{ pve_result.json.data }}"
