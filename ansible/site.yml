---
# Plays run in order: base -> network -> cluster -> storage -> access.
- name: Base configuration
  hosts: pve
  tags: [base]
  roles:
    - role: base

- name: Network configuration (commit-confirm with automatic rollback)
  hosts: pve
  tags: [network]
  roles:
    - role: network

- name: Cluster (create on the primary when no node is clustered yet)
  hosts: pve
  any_errors_fatal: true
  tags: [cluster]
  roles:
    - role: cluster

# One node at a time: a join restarts corosync/pmxcfs on the joining node and changes quorum.
- name: Cluster (join the remaining nodes)
  hosts: pve
  serial: 1
  any_errors_fatal: true
  tags: [cluster]
  tasks:
    - name: Join the cluster
      ansible.builtin.import_role:
        name: cluster
        tasks_from: join

- name: Storage (pools per node, storage.cfg once)
  hosts: pve
  tags: [storage]
  roles:
    - role: storage

# Users and tokens live in the shared /etc/pve/user.cfg, so they are created once, after the
# cluster exists (before a join they would be lost). Still part of the base role.
- name: Users, ACLs and API tokens
  hosts: pve
  run_once: true
  tags: [access, base]
  tasks:
    - name: Create users, ACLs and tokens
      ansible.builtin.import_role:
        name: base
        tasks_from: access
