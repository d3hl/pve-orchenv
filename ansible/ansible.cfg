# Run from the repo root with ANSIBLE_CONFIG=ansible/ansible.cfg (the Makefile does this).
# Paths below are relative to this file. Running from the root matters for the SSH settings:
# inventory/e2e.yml refers to config/ssh/pve_ed25519 and cache/e2e/known_hosts relative to the cwd.
# SSH host keys are checked (Ansible's default). Each inventory sets StrictHostKeyChecking=accept-new:
# e2e.yml with its own throwaway known_hosts, hosts.yml with ~/.ssh/known_hosts.
[defaults]
inventory = ../inventory/e2e.yml
collections_path = collections
vault_password_file = ../config/vault-pass
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
