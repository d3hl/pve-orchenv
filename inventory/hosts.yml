---
# Real site. Shared defaults live in group_vars/all/main.yml; site-specific vars are here.
all:
  vars:
    domain: lab.internal
    gateway: 10.10.10.2
    dns: [10.10.10.2]
    cluster_name: homelab
  children:
    pve:
      hosts:
        pve1:
          install: false
          mac: "aa:bb:cc:dd:ee:01"
          mgmt_ip: 10.10.10.11/24
          root_disks:
            fs: zfs
            raid: raid1
            serials: ["CHANGEME-PVE1-A", "CHANGEME-PVE1-B"]
          cluster_role: primary
        pve2:
          install: false
          mac: "aa:bb:cc:dd:ee:02"
          mgmt_ip: 10.10.10.12/24
          root_disks:
            fs: zfs
            raid: raid1
            serials: ["CHANGEME-PVE2-A", "CHANGEME-PVE2-B"]
          cluster_role: member
        pve3:
          install: false
          mac: "aa:bb:cc:dd:ee:03"
          mgmt_ip: 10.10.10.13/24
          root_disks:
            fs: zfs
            raid: raid1
            serials: ["CHANGEME-PVE3-A", "CHANGEME-PVE3-B"]
          cluster_role: member
