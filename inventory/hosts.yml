---
# Real site. Shared defaults live in group_vars/all/main.yml; site-specific vars are here.
all:
  vars:
    site: remote   # config/remote.env
    domain: d3adc3ii.cc
    gateway: 10.10.10.2
    dns: [10.10.10.2]
    cluster_name: d3lab
  children:
    pve:
      vars:
        # Ansible connection (as in inventory/e2e.yml). The installer authorises only the project key
        # for root. Key path is relative to the repo root (run with ANSIBLE_CONFIG=ansible/ansible.cfg).
        ansible_user: root
        ansible_ssh_private_key_file: config/ssh/pve_ed25519
        ansible_host: "{{ mgmt_ip | split('/') | first }}"
        # Host keys are checked; a node's first key is recorded on first contact (accept-new), a changed
        # key is refused. rebuild.yml forgets a rebuilt node's old key (~/.ssh/known_hosts).
        ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new
      hosts:
        pve1:
          install: false
          mac: "aa:bb:cc:dd:ee:01"
          mgmt_ip: 10.10.10.11/24
          root_disks:
            fs: zfs
            raid: raid1
            serials: ["CHANGEME-PVE1-A", "CHANGEME-PVE1-B"]
          cluster_role: primary
        pve2:
          install: false
          mac: "aa:bb:cc:dd:ee:02"
          mgmt_ip: 10.10.10.12/24
          root_disks:
            fs: zfs
            raid: raid1
            serials: ["CHANGEME-PVE2-A", "CHANGEME-PVE2-B"]
          cluster_role: member
        pve3:
          install: false
          mac: "aa:bb:cc:dd:ee:03"
          mgmt_ip: 10.10.10.13/24
          root_disks:
            fs: zfs
            raid: raid1
            serials: ["CHANGEME-PVE3-A", "CHANGEME-PVE3-B"]
          cluster_role: member
        pve4:
          install: false
          mac: "aa:bb:cc:dd:ee:04"   # CHANGEME real MAC
          mgmt_ip: 10.10.10.14/24
          root_disks:
            fs: zfs
            raid: raid1
            serials: ["CHANGEME-PVE4-A", "CHANGEME-PVE4-B"]
          cluster_role: member
